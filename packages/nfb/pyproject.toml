[project]
name = "nfb"
version = "0.1.0"
description = "Neurofeedback acquisition, recording and processing"
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22",
    "libusb-package>=1.0.30.0",
    "numpy>=2.5.1",
    "optima",
    "pyusb>=1.3.1",
    "scipy>=1.18.0",
]

# `bleak` was an extra for a while, on the argument that the EEG path must keep working without
# Bluetooth. It does keep working — `nfb.hrv.sources` and `nfb.heg.source` import it lazily and never at
# startup, and that is what actually buys the independence. Being an extra bought nothing on top of that
# except an install step nobody was told about: the strap and the Mendi headband are two of the three
# devices this program talks to, and both simply failed to connect until you found the flag. It is a
# pure-Python wheel over the OS's own Bluetooth stack, so the cost of having it is a few hundred kB.
# The lazy imports and each `problem()` stay, because a machine with no Bluetooth radio still has to say
# so on the screen rather than raise.

[project.scripts]
nfb = "nfb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
